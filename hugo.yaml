baseURL: https://wiki.bigledger.com/
title: akaun.com by BigLedger
defaultContentLanguage: en
defaultContentLanguageInSubdir: false
theme: hextra
enableGitInfo: true
enableRobotsTXT: true

outputFormats:
  llms:
    baseName: "llms"
    isPlainText: true
    mediaType: "text/plain"
    notAlternative: true
  llmsfull:
    baseName: "llms-full"
    isPlainText: true
    mediaType: "text/plain"
    notAlternative: true

markup:
  goldmark:
    renderer:
      unsafe: true

languages:
  en:
    languageName: English
    languageCode: en
    contentDir: content/en
    title: akaun.com by BigLedger
    weight: 1
    params:
      description: "akaun.com by BigLedger — a web-based, cloud-native business operating system: accounting, inventory, sales, purchasing, POS, e-commerce and Malaysian e-Invoice. The backbone for AI agents via API, MCP and SDK."
  
  zh:
    languageName: 中文
    languageCode: zh-CN
    contentDir: content/zh
    title: akaun.com by BigLedger
    weight: 2
    params:
      description: "akaun.com by BigLedger — 基于网页的云原生业务运营系统：会计、库存、销售、采购、POS、电子商务与马来西亚电子发票。通过 API、MCP 与 SDK 成为 AI 智能体的业务骨干。"
  
  ms:
    languageName: Bahasa Melayu
    languageCode: ms
    contentDir: content/ms
    title: akaun.com by BigLedger
    weight: 3
    params:
      description: "akaun.com by BigLedger — sistem operasi perniagaan berasaskan web dan awan: perakaunan, inventori, jualan, pembelian, POS, e-dagang dan e-Invois Malaysia. Tulang belakang untuk ejen AI melalui API, MCP dan SDK."
  
  ar:
    languageName: العربية
    languageCode: ar
    contentDir: content/ar
    title: akaun.com by BigLedger
    weight: 4
    languageDirection: rtl
    params:
      description: "akaun.com by BigLedger — نظام تشغيل للأعمال قائم على الويب وسحابي المنشأ: المحاسبة والمخزون والمبيعات والمشتريات ونقاط البيع والتجارة الإلكترونية والفوترة الإلكترونية الماليزية. العمود الفقري لوكلاء الذكاء الاصطناعي عبر API وMCP وSDK."

params:
  title: akaun.com by BigLedger
  displayUpdatedDate: true
  displayUpdatedAuthor: false
  # Theme settings
  theme:
    default: light
    displayToggle: true
    
  # Navigation
  navbar:
    displayTitle: false
    displayLogo: true
    logo:
      path: images/bigledger-logo-cropped.png
      dark: images/bigledger-logo-cropped.png
      width: 200
      height: 40
      link: /
    width: wide
    
  # Page settings
  page:
    width: wide
    
  # Footer
  footer:
    displayCopyright: false  # We handle copyright in custom footer
    displayPoweredBy: false  # Remove Hextra branding
    width: wide
    
  # Edit this page
  editURL:
    enable: true
    base: "https://github.com/bigledger/blg-wiki/edit/main/content"
    
  # Search
  search:
    enable: true
    type: flexsearch
      
  # Sidebar
  sidebar:
    enable: true
    fold: false
    showPages: true      # Show all pages in sidebar
    showCategories: true # Show category organization
    showTags: false     # Hide tags in sidebar
    forceEnable: true   # Force sidebar on all pages
    
  # Table of contents
  toc:
    enable: true
    headingLevel: 3
    startLevel: 2       # Start from H2 headings
    endLevel: 4         # Show up to H4 headings
    ordered: false      # Use bullets instead of numbers
    
  # Comments
  comments:
    enable: false
    
  # Analytics
  analytics:
    enable: false
    
  # Social links
  socialLinks:
    - icon: github
      link: https://github.com/bigledger
    - icon: twitter
      link: https://twitter.com/bigledger
      
  # Custom CSS for high-tech theme
  custom_css:
    - css/custom.css

