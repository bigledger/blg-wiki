outputs:
  home:
    - HTML
    - RSS
    - llms  # For search functionality

deployment:
  targets:
    - name: production
      URL: s3://wiki.bigledger.com?region=ap-southeast-5
      cloudFrontDistributionID: E3FOFD9ZXC2QVT

# Permalink configuration to ensure consistent URLs
permalinks:
  pages: /:slug/
  posts: /:slug/

# URL management
disablePathToLower: false
relativeURLs: false
canonifyURLs: true