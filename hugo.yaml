baseURL: https://wiki.bigledger.com/
title: BigLedger Documentation
defaultContentLanguage: en
defaultContentLanguageInSubdir: false
theme: hextra
enableGitInfo: true
enableRobotsTXT: true

outputFormats:
  llms:
    baseName: "index"
    isPlainText: true
    mediaType: "text/plain"

markup:
  goldmark:
    renderer:
      unsafe: true

languages:
  en:
    languageName: English
    languageCode: en
    contentDir: content/en
    title: BigLedger Documentation
    weight: 1
    params:
      description: BigLedger Documentation - Next-Generation Blockchain Platform
  
  zh:
    languageName: 中文
    languageCode: zh-CN
    contentDir: content/zh
    title: BigLedger 文档
    weight: 2
    params:
      description: BigLedger 文档 - 下一代区块链平台
  
  ms:
    languageName: Bahasa Melayu
    languageCode: ms
    contentDir: content/ms
    title: Dokumentasi BigLedger
    weight: 3
    params:
      description: Dokumentasi BigLedger - Platform Blockchain Generasi Seterusnya
  
  ar:
    languageName: العربية
    languageCode: ar
    contentDir: content/ar
    title: وثائق BigLedger
    weight: 4
    languageDirection: rtl
    params:
      description: وثائق BigLedger - منصة البلوك تشين من الجيل التالي

params:
  # Theme settings
  theme:
    default: light
    displayToggle: true
    
  # Navigation
  navbar:
    displayTitle: false
    displayLogo: true
    logo:
      path: images/bigledger-logo-cropped.png
      dark: images/bigledger-logo-cropped.png
      width: 200
      height: 40
      link: /
    width: wide
    
  # Page settings
  page:
    width: wide
    
  # Footer
  footer:
    displayCopyright: false  # We handle copyright in custom footer
    displayPoweredBy: false  # Remove Hextra branding
    width: wide
    
  # Edit this page
  editURL:
    enable: true
    base: "https://github.com/bigledger/blg-wiki/edit/main/content"
    
  # Search
  search:
    enable: true
    type: flexsearch
      
  # Sidebar
  sidebar:
    enable: true
    fold: false
    showPages: true      # Show all pages in sidebar
    showCategories: true # Show category organization
    showTags: false     # Hide tags in sidebar
    forceEnable: true   # Force sidebar on all pages
    
  # Table of contents
  toc:
    enable: true
    headingLevel: 3
    startLevel: 2       # Start from H2 headings
    endLevel: 4         # Show up to H4 headings
    ordered: false      # Use bullets instead of numbers
    
  # Comments
  comments:
    enable: false
    
  # Analytics
  analytics:
    enable: false
    
  # Social links
  socialLinks:
    - icon: github
      link: https://github.com/bigledger
    - icon: twitter
      link: https://twitter.com/bigledger
      
  # Custom CSS for high-tech theme
  custom_css:
    - css/custom.css

# Menu configuration
