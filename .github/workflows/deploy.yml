name: Deploy BigLedger Wiki to S3

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  quality:
    name: Quality gate (build, lints, links, Playwright)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Setup Hugo
        run: |
          wget -q https://github.com/gohugoio/hugo/releases/download/v0.147.9/hugo_extended_withdeploy_0.147.9_linux-amd64.tar.gz
          mkdir -p /tmp/hugo-bin && tar -xzf hugo_extended_withdeploy_0.147.9_linux-amd64.tar.gz -C /tmp/hugo-bin hugo
          sudo mv /tmp/hugo-bin/hugo /usr/local/bin/hugo   # the repo has a hugo/ directory at its root; never extract there
          hugo version

      - name: Build
        run: hugo --gc --minify

      - name: Content lints (conflict markers, leaked transcripts, product claims, Malay, mojibake, titles)
        run: tests/content-lint.sh

      - name: Install lychee
        run: |
          curl -sSL https://github.com/lycheeverse/lychee/releases/download/lychee-v0.24.2/lychee-x86_64-unknown-linux-gnu.tar.gz | tar -xz
          sudo mv lychee /usr/local/bin/

      - name: Link check (offline, gated on tests/lychee-baseline.txt)
        run: tests/lychee-gate.sh

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/playwright/package-lock.json

      - name: Install Playwright
        working-directory: tests/playwright
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Playwright against a local Hugo server
        working-directory: tests/playwright
        run: |
          (cd ../.. && hugo server --port 1313 --bind 127.0.0.1 --baseURL http://127.0.0.1:1313/ --appendPort=false --logLevel warn > /tmp/hugo-server.log 2>&1 &)
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:1313/ >/dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:1313/ >/dev/null || { echo "hugo server did not start"; cat /tmp/hugo-server.log; exit 1; }
          BASE_URL=http://127.0.0.1:1313 npx playwright test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/playwright/playwright-report
          retention-days: 7

  deploy:
    needs: quality
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Setup Hugo
        run: |
          wget https://github.com/gohugoio/hugo/releases/download/v0.147.9/hugo_extended_withdeploy_0.147.9_linux-amd64.tar.gz
          rm -rf hugo
          tar -xzf hugo_extended_withdeploy_0.147.9_linux-amd64.tar.gz
          sudo mv hugo /usr/local/bin/
          hugo version

      - name: Build Hugo site
        run: hugo --minify

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy to S3 and Invalidate CloudFront
        run: |
          # Hugo deploy handles both S3 upload and CloudFront invalidation
          echo "Deploying to S3 and invalidating CloudFront distribution E3FOFD9ZXC2QVT"
          hugo deploy --target=production --maxDeletes -1 --invalidateCDN
          
      - name: Verify CloudFront Invalidation
        if: success()
        run: |
          echo "Checking recent CloudFront invalidations..."
          aws cloudfront list-invalidations \
            --distribution-id E3FOFD9ZXC2QVT \
            --max-items 3 \
            --query 'InvalidationList.Items[0].[Id,Status,CreateTime]' \
            --output table
          echo "✅ Deployment and invalidation completed"

      - name: Verify deployment
        run: |
          echo "Site deployed to: https://wiki.bigledger.com"
          echo "Checking if site is accessible..."
          curl -I https://wiki.bigledger.com || true