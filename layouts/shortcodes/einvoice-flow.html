<title id="einv-title">What happens after you finalise a document</title>
<desc id="einv-desc">A finalised sales or self-billed purchase document enters the posting queue. BigLedger then routes it on its submission type, its amount and whether the mandatory fields are complete: incomplete documents are held in the Individual, Single General or Batch pool, complete ones go to the submission queue, and Batch Pool documents are swept into the monthly consolidation by the 7th. The submission queue and the consolidation both call LHDN MyInvois, one document per call, and LHDN returns Valid or Invalid.</desc>
